name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: |
          VERSION=$(grep -m1 'VERSION = ' netcup-cli.py | cut -d'"' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dpkg-dev
        run: sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: bash build-deb.sh

      - name: Delete existing 'latest' release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          gh release create latest \
            --title "netcup-cli v${VERSION} (latest)" \
            --notes "Automatically built from the latest commit on main." \
            --prerelease \
            deb-build/netcup-cli_${VERSION}_all.deb
